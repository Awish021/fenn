services:
  backend-migrate:
    build:
      context: ./backend
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: sqlite:////data/venndiagram.db
    volumes:
      - backend-data:/data
    command:
      [
        "sh",
        "-c",
        "alembic -c alembic.ini upgrade head && python alembic/bootstrap.py",
      ]

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: sqlite:////data/venndiagram.db
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request, urllib.error, sys; try:\n    resp = urllib.request.urlopen('http://localhost:8000/health')\nexcept urllib.error.URLError:\n    sys.exit(1)\nsys.exit(0 if resp.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    volumes:
      - ./backend:/app
      - backend-data:/data
    depends_on:
      backend-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  backend-data:
  frontend-node-modules:
