services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: sqlite:////data/venndiagram.db
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request, urllib.error, sys; try:\n    resp = urllib.request.urlopen('http://localhost:8000/health')\nexcept urllib.error.URLError:\n    sys.exit(1)\nsys.exit(0 if resp.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_PROXY_TARGET=http://backend:8000

volumes:
  backend-data:
